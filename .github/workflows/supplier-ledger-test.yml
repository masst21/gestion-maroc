name: Combined supplier and client PostgreSQL upgrades
on:
  push:
    branches: [test/combined-postgres-upgrades]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledger_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger_test -d ledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://ledger_test:local_test_only@localhost:5432/ledger_test
      PGPASSWORD: local_test_only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Recreate previous schema on isolated database
        run: |
          git fetch --depth=1 origin e133afcc310a4631ff9fa735b0cb02d6f5ddeb11
          git show FETCH_HEAD:prisma/schema.prisma > prisma/test-before.prisma
          npx prisma db push --schema prisma/test-before.prisma --skip-generate
      - name: Seed legacy data and apply upgrade
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supplier-ledger-before.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/postgresql-upgrades/20261128_supplier_ledger.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/postgresql-upgrades/20261128_client_identity.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supplier-ledger-after.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/client-identity-after.sql
      - name: Check Prisma schema
        run: |
          npx prisma validate
          npx prisma generate
